# No secrets here. Only secret names and key names.
postgres:
  name: saleor-postgres
  replicas: 1
  image:
    repository: postgres
    tag: 15.19-alpine3.24
    pullPolicy: IfNotPresent
  port: 5432
  user: saleor
  database: saleor
  pgdata: /var/lib/postgresql/data/pgdata
  runAsUser: 70
  credentials:
    secretName: saleor-db-credentials
    passwordKey: POSTGRES_PASSWORD
  persistence:
    claimName: data
    size: 5Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  probes:
    startup:   { periodSeconds: 5,  failureThreshold: 36 }
    liveness:  { periodSeconds: 20, failureThreshold: 6, timeoutSeconds: 5 }
    readiness: { periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 5 }

cache:
  name: saleor-valkey
  replicas: 1
  image:
    repository: valkey/valkey
    tag: 8.1.10-alpine
    pullPolicy: IfNotPresent
  port: 6379
  maxmemory: 96mb
  maxmemoryPolicy: noeviction
  extraArgs: ["--save", "", "--appendonly", "no", "--protected-mode", "no"]
  runAsUser: 999
  runAsGroup: 1000
  resources:
    requests: { cpu: 25m, memory: 16Mi }
    limits:   { cpu: 200m, memory: 128Mi }
  probes:
    startup:   { periodSeconds: 3,  failureThreshold: 20 }
    liveness:  { periodSeconds: 20, failureThreshold: 6, timeoutSeconds: 3 }
    readiness: { periodSeconds: 10, timeoutSeconds: 3 }

api:
  name: saleor-api
  replicas: 1
  image:
    repository: ghcr.io/saleor/saleor
    tag: 3.23.41
    pullPolicy: IfNotPresent
  port: 8000
  runAsUser: 999
  runAsGroup: 999
  readOnlyRootFilesystem: true
  secrets:
    appSecretName: saleor-app-secrets
    secretKeyKey: SECRET_KEY
    rsaKey: RSA_PRIVATE_KEY
  # Plain literals only. DATABASE_URL and CELERY_BROKER_URL are built in the template.
  # EMAIL_URL is not set: Mailpit is not in the cluster yet.
  # AWS_STORAGE_BUCKET_NAME is not set: media is local for now.
  env:
    DEBUG: "False"
    ENABLE_SSL: "False"
    PUBLIC_URL: "http://api-dev.cdp.test"
    ALLOWED_CLIENT_HOSTS: "dash-dev.cdp.test,shop-dev.cdp.test,api-dev.cdp.test"
    ALLOWED_HOSTS: "api-dev.cdp.test,localhost,127.0.0.1"
  resources:
    requests: { cpu: 100m, memory: 300Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  probes:
    startup:   { periodSeconds: 10, failureThreshold: 60, timeoutSeconds: 10 }
    liveness:  { periodSeconds: 20, failureThreshold: 6, timeoutSeconds: 10 }
    readiness: { periodSeconds: 10, failureThreshold: 6, timeoutSeconds: 10 }

worker:
  name: saleor-worker
  replicas: 1
  image:
    repository: ghcr.io/saleor/saleor
    tag: 3.23.41
    pullPolicy: IfNotPresent
  logLevel: info
  # Celery starts one child process per CPU by default. One is enough on this VM.
  concurrency: 1
  runAsUser: 999
  runAsGroup: 999
  resources:
    requests: { cpu: 100m, memory: 300Mi }
    limits:   { cpu: 500m, memory: 768Mi }
  probes:
    startup:   { periodSeconds: 5,  failureThreshold: 60, timeoutSeconds: 10 }
    liveness:  { periodSeconds: 20, failureThreshold: 6,  timeoutSeconds: 10 }
    readiness: { periodSeconds: 20, failureThreshold: 6,  timeoutSeconds: 10 }

scheduler:
  name: saleor-scheduler
  image:
    repository: ghcr.io/saleor/saleor
    tag: 3.23.41
    pullPolicy: IfNotPresent
  logLevel: info
  runAsUser: 999
  runAsGroup: 999
  resources:
    requests: { cpu: 50m,  memory: 150Mi }
    limits:   { cpu: 300m, memory: 512Mi }
  probes:
    startup:   { periodSeconds: 5,  failureThreshold: 60, timeoutSeconds: 10 }
    liveness:  { periodSeconds: 20, failureThreshold: 6,  timeoutSeconds: 10 }
    readiness: { periodSeconds: 20, failureThreshold: 6,  timeoutSeconds: 10 }

# Phase 3 serves plain HTTP on the Traefik "web" entrypoint. Phase 5 adds TLS.
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  hosts:
    api: api-dev.cdp.test
    dashboard: dash-dev.cdp.test
    storefront: ""   # Phase 9, not rendered yet

dashboard:
  replicaCount: 1
  image:
    repository: ghcr.io/saleor/saleor-dashboard
    tag: "3.23.39"
  # The browser calls this URL, so it must be the public api name (Task 5 exposes it).
  apiUrl: http://api-dev.cdp.test/graphql/
  port: 80
  runAsUser: 101
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  # Scratch space nginx writes to while the root filesystem is read-only.
  writablePaths:
    - /var/cache/nginx
    - /run
    - /tmp
