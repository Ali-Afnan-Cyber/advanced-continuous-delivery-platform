{{- /*
The probe command checks that a celery worker process exists.
It reads /proc because pgrep and ps are not in the Saleor image.
The pattern "[w]orker" matches "worker" but does not match its own text,
so the probe cannot find itself.
*/ -}}
{{- $alive := list "sh" "-c" "cat /proc/[0-9]*/cmdline 2>/dev/null | tr '\\0' ' ' | grep -q 'celery.*[w]orker'" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.worker.name }}
  labels:
    {{- include "saleor.labels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "saleor.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "saleor.labels" (dict "root" . "component" "worker") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.worker.runAsUser }}
        runAsGroup: {{ .Values.worker.runAsGroup }}
        fsGroup: {{ .Values.worker.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command:
            - celery
            - --app
            - saleor.celeryconf:app
            - worker
            - --loglevel={{ .Values.worker.logLevel }}
            - --concurrency={{ .Values.worker.concurrency }}
          env:
            {{- include "saleor.celeryEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: {{ toJson $alive }}
            {{- toYaml .Values.worker.probes.startup | nindent 12 }}
          livenessProbe:
            exec:
              command: {{ toJson $alive }}
            {{- toYaml .Values.worker.probes.liveness | nindent 12 }}
          readinessProbe:
            exec:
              command: {{ toJson $alive }}
            {{- toYaml .Values.worker.probes.readiness | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: media
              mountPath: /app/media
      volumes:
        - name: tmp
          emptyDir: {}
        - name: media
          emptyDir: {}