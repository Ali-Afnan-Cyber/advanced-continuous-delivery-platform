{{- $ctx := dict "component" "api" "root" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.api.name }}
  labels:
    {{- include "saleor.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "saleor.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
