apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.cache.name }}
  labels:
    {{- include "saleor.labels" (dict "root" . "component" "cache") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: valkey
      port: {{ .Values.cache.port }}
      targetPort: valkey
  selector:
    {{- include "saleor.selectorLabels" (dict "root" . "component" "cache") | nindent 4 }}
