{{- $ctx := dict "component" "saleor-dashboard" "root" . }}
apiVersion: v1
kind: Service
metadata:
  name: saleor-dashboard
  labels:
    {{- include "saleor.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "saleor.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
