apiVersion: v1
kind: Service
metadata:
  name: saleor-postgres
  namespace: saleor-dev
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: saleor-dev
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: acdp
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: saleor-dev
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: saleor-postgres
  namespace: saleor-dev
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: saleor-dev
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: acdp
spec:
  serviceName: saleor-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: saleor-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: saleor-dev
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: acdp
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:15.19-alpine3.24
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: saleor
            - name: POSTGRES_DB
              value: saleor
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: saleor-db-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "saleor", "-d", "saleor"]
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "saleor", "-d", "saleor"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "saleor", "-d", "saleor"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
