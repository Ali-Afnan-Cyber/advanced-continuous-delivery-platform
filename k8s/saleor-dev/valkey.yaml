apiVersion: v1
kind: Service
metadata:
  name: saleor-valkey
  namespace: saleor-dev
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: saleor-dev
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: acdp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: saleor-dev
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saleor-valkey
  namespace: saleor-dev
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: saleor-dev
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: acdp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: saleor-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: saleor-dev
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: acdp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:8.1.10-alpine
          imagePullPolicy: IfNotPresent
          args:
            - valkey-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 96mb
            - --maxmemory-policy
            - noeviction
            - --protected-mode
            - "no"
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["sh", "-c", "test \"$(valkey-cli ping)\" = PONG"]
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            exec:
              command: ["sh", "-c", "test \"$(valkey-cli ping)\" = PONG"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "test \"$(valkey-cli ping)\" = PONG"]
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
